# KRT Terminal — starting test thresholds (backtest மூலம் validate செய்ய வேண்டும்)
universe: [RELIANCE, HDFCBANK, ICICIBANK, INFY, TCS, SBIN, MARUTI, LT]
index_symbol: NIFTY
timeframe_minutes: 15

volume:
  rvol_pass: 1.5
  rvol_high_participation: 2.0
  lookback_days: 10

entry:
  max_extension_pct: 0.6     # level-ல் இருந்து இதற்கு மேல் போனால் EXTENDED
  min_targets: 3

risk:
  max_risk_per_trade: 2500   # ₹ planned risk cap (intraday)
  max_risk_holding: 5000     # ₹ swing / elite hold / pattern holding — 1 lot planned risk cap
  account_risk_limit: null   # user account-based limit (null = ignore)
  charges_slippage: 150      # ₹ estimated allowance
  daily_loss_limit: 5000    # இன்றைய intraday paper நஷ்டம் இதைத் தாண்டினா புது calls நிற்கும்
  breakeven_after_t1: true  # T1 பிறகு SL → entry
  max_open_positions: 3

score_weights:
  setup_structure: 25
  relative_strength: 20
  volume: 15
  alignment: 15
  room_reward_risk: 15
  liquidity: 10

chartink:
  enabled: true
  ce_url: https://chartink.com/screener/1-2026-02-15-7
  pe_url: https://chartink.com/screener/pe-calls-list
  ce_clause: ""        # auto-extract fail ஆனால் மட்டும் scan clause இங்கே paste
  pe_clause: ""
  max_per_side: 25
  fno_only: true       # F&O stocks மட்டும் (option trade-க்கு)

# ஒவ்வொரு call-க்கும் குறைந்தபட்ச லாப target (1 lot, ₹): T1 / T2 / T3
money_targets: [1200, 3000, 6000]

# 20+ closed calls-ல் சராசரி நஷ்டம் உள்ள setup → ⏸ PAUSED (paper-ல் மட்டும் track; லாபம் திரும்பினா தானா resume)
auto_pause_negative: false   # true = நஷ்ட setup calls paper-ல் மட்டும் (hide)

# V3.2 call quality rules — block இல்லை: எல்லா calls-ம் வரும், Grade A / B / C மட்டும் (A = எல்லா rules ✓)
quality:
  enabled: true
  min_rvol: 2.0            # Breakout / ORB / Elite / Volume+OI / All rounder
  max_calls_per_day: 3     # main intraday calls
  max_spread_pct: 2.0
  pullback_entry: true     # breakout candle-ல் வாங்காம pullback + resume-ல் entry
